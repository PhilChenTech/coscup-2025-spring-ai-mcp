# Application name
spring.application.name=books

# Disable web application type
spring.main.web-application-type=none

# AI MCP server name
spring.ai.mcp.server.name=spring.ai.mcp-server

# AI MCP server version
spring.ai.mcp.server.version=0.0.1

# Disable startup banner
spring.main.banner-mode=off

# Console log pattern (default empty)
logging.pattern.console=

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/mcp-test
spring.datasource.username=postgres
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
